# Keep the official Web profile and client roster, but replace every physical
# HTTP/WebSocket surface with process-local Electron IPC plugins from this package.

- id: directory-picker
  disabled: true

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: modules
  disabled: true

- id: connection
  disabled: true

- insert:
    - id: desktop-modules-host
      name: 'oi-dsh-desktop-bundle/modules'

    - id: desktop-connection-host
      name: 'oi-dsh-desktop-bundle/connection'

    - id: desktop-directory-picker-host
      name: 'oi-dsh-desktop-bundle/directory-picker'

    - id: desktop-directory-picker-client
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
